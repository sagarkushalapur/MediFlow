# MediQR: Spring Boot Application Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mediqr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize Database with Seed Data (Optional, set to 'never' in production)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Security Configuration
mediqr.jwt.secret=${MEDIQR_JWT_SECRET}
mediqr.jwt.expiration-ms=86400000

# Base QR Code Scan URL
mediqr.app.base-url=http://localhost:8080
